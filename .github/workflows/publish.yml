name: Publish

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
      # NuGet trusted publishing exchanges the workflow's OIDC token for a
      # short-lived API key
      id-token: write
    steps:
    - name: checkout project
      uses: actions/checkout@v4

    - name: setup msbuild
      uses: microsoft/setup-msbuild@v2

    - name: setup nuget
      uses: NuGet/setup-nuget@v2

    - name: setup cppwinrt
      run: nuget restore test.sln

    - name: build x86
      run: msbuild /m /p:Configuration=Release,Platform=x86 test.sln

    - name: build x64
      run: msbuild /m /p:Configuration=Release,Platform=x64 test.sln

    - name: build ARM64
      run: msbuild /m /p:Configuration=Release,Platform=ARM64 test.sln

    - name: nuget pack
      run: nuget.exe pack TestComponent/TestComponent.nuspec -OutputFileNamesWithoutVersion

    - name: nuget login
      id: login
      uses: NuGet/login@v1
      with:
        user: dlech

    - name: nuget push
      run: nuget push PyWinRT.TestWinRT.nupkg -Source nuget.org -ApiKey ${{ steps.login.outputs.NUGET_API_KEY }}
